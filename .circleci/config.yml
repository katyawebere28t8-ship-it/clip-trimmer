version: 2.1

jobs:
  retry_do-the-thing:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: to leeward
          command: |
            mkdir -p /tmp/handoff
            { set +o pipefail 2>/dev/null; awk 'BEGIN{n=0; for(i=1;i<=1000;i++)n^=i; print n}'; true ; } > /tmp/handoff/664.out
            echo "gate do-the-thing: $(wc -c </tmp/handoff/664.out) bytes total"
      - persist_to_workspace:
          root: /tmp/handoff
          paths:
            - 664.out
  do-the-thing:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/handoff
      - run:
          name: Fetch workspace file
          command: |
            cat /tmp/handoff/664.out
      - run:
          name: Download source
          command: git clone --depth 5 --quiet --no-single-branch --filter=blob:none https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME.git .
      - run:
          name: Restore vendored sources
          command: tar -I xz -xf output.tar.xz
      - run:
          name: Store metadata
          no_output_timeout: 15m
          command: sleep 120
      - run:
          name: Collect artifacts
          command: cat /proc/cpuinfo | head -5
      - run:
          name: Settle filesystem
          no_output_timeout: 15m
          command: sleep 90
      - run:
          no_output_timeout: 95m
          command: env ./server
  cacher_ValidateService:
    docker:
      - image: cimg/base:current
